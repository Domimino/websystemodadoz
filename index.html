<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODADOZ - Přihláška do zájmového útvaru</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        fieldset {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fafafa;
        }
        legend {
            font-weight: bold;
            color: var(--primary-color);
            padding: 0 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
        }
        .checkbox-group input {
            margin-top: 5px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #004085;
        }
        .note {
            font-size: 0.85em;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ODADOZ</h1>
    <p class="subtitle">Všestranná pohybová přípravka 2025<br>Kulturní dům Hradiště, Těrlicko</p>

    <form id="regForm">
        
        <!-- Zájmový útvar -->
        <fieldset>
            <legend>Výběr zájmového útvaru</legend>
            <div class="form-group">
                <label for="utvar">Zvolte kroužek *</label>
                <select id="utvar" name="utvar" required>
                    <option value="">-- Vyberte kroužek --</option>
                    <option value="Všestranná pohybová přípravka I">Všestranná pohybová přípravka I (2-4 roky s rodičem) - 2000 Kč / 15 lekcí</option>
                    <option value="Všestranná pohybová přípravka II">Všestranná pohybová přípravka II (od 4 let bez rodiče) - 2200 Kč / 15 lekcí</option>
                </select>
            </div>
        </fieldset>

        <!-- Údaje o dítěti -->
        <fieldset>
            <legend>Údaje o dítěti</legend>
            <div class="form-group">
                <label for="diteJmeno">Jméno a příjmení dítěte *</label>
                <input type="text" id="diteJmeno" name="diteJmeno" required>
            </div>
            <div class="form-group">
                <label for="diteDatumNarozeni">Datum narození dítěte *</label>
                <input type="date" id="diteDatumNarozeni" name="diteDatumNarozeni" required>
            </div>
            <div class="form-group">
                <label for="diteRodneCislo">Rodné číslo dítěte (bez lomítka) *</label>
                <input type="text" id="diteRodneCislo" name="diteRodneCislo" placeholder="např. 2005123456" required pattern="\d{9,10}">
                <span class="note">Povinné kvůli evidenci a úrazovému pojištění.</span>
            </div>
            <div class="form-group">
                <label for="diteAdresa">Adresa trvalého bydliště dítěte *</label>
                <input type="text" id="diteAdresa" name="diteAdresa" required>
            </div>
            <div class="form-group">
                <label for="alergie">Alergie (pokud ano, uveďte druh) *</label>
                <input type="text" id="alergie" name="alergie" value="Ne" required>
            </div>
            <div class="form-group">
                <label for="omezeni">Zdravotní omezení (bojí se výšek, neumí plavat, úrazy apod.) *</label>
                <input type="text" id="omezeni" name="omezeni" value="Žádné" required>
            </div>
        </fieldset>

        <!-- Fakturační údaje -->
        <fieldset>
            <legend>Fakturační údaje (Zákonný zástupce)</legend>
            <div class="form-group">
                <label for="zakonnyZastupce">Jméno a příjmení zákonného zástupce *</label>
                <input type="text" id="zakonnyZastupce" name="zakonnyZastupce" required>
            </div>
            <div class="form-group">
                <label for="fakturaAdresa">Fakturační adresa (Ulice, č.p., Město, PSČ) *</label>
                <input type="text" id="fakturaAdresa" name="fakturaAdresa" placeholder="Např. Hradišťská 50, Těrlicko, 735 42" required>
            </div>
            <div class="form-group">
                <label for="email">Váš e-mail (pro doručení platebních údajů a přihlášky) *</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="telefon">Telefon na zákonného zástupce *</label>
                <input type="tel" id="telefon" name="telefon" placeholder="+420..." required>
            </div>
        </fieldset>

        <!-- Ostatní osoby a poznámky -->
        <fieldset>
            <legend>Vyzvedávání a poznámky</legend>
            <div class="form-group">
                <label for="vyzvedavani">Osoby oprávněné k vyzvednutí dítěte (Jméno, adresa, tel.)</label>
                <textarea id="vyzvedavani" name="vyzvedavani"></textarea>
            </div>
            <div class="form-group">
                <label for="poznamky">Poznámky</label>
                <textarea id="poznamky" name="poznamky"></textarea>
            </div>
        </fieldset>

        <!-- Souhlasy -->
        <fieldset>
            <legend>Souhlasy a prohlášení</legend>
            <div class="checkbox-group">
                <input type="checkbox" id="zdravi" required>
                <label for="zdravi">Čestně prohlašuji, že dítě je zdravotně způsobilé a absolvuje pravidelné prohlídky. *</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="gdpr" required>
                <label for="gdpr">Souhlasím se zpracováním osobních údajů (GDPR). *</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="zraneni" required>
                <label for="zraneni">Souhlasím s poskytnutím první pomoci a ošetření v případě zranění. *</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="foto1">
                <label for="foto1">Souhlasím se zveřejněním podobizny dítěte na IG @odadoz_cz a FB ODADOZ (na 3 roky).</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="foto2">
                <label for="foto2">Souhlasím se zveřejněním obličeje a křestního jména v souvislosti s výsledky/akcemi.</label>
            </div>
        </fieldset>

        <button type="submit" id="submitBtn">Odeslat závaznou přihlášku</button>
    </form>
</div>

<script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Odesílám...';

        // SEM VLOŽ SVOJI AKTUÁLNÍ URL ADRESU Z GOOGLE APPS SCRIPTU (Nasazená webová aplikace)
        const scriptURL = 'SEM_VLOZ_URL_ADRESU_Z_APPS_SCRIPTU';

        // Převedení formuláře na správný formát pro Apps Script
        const formData = new FormData(this);
        const urlEncodedData = new URLSearchParams();
        for (const pair of formData.entries()) {
            urlEncodedData.append(pair[0], pair[1]);
        }

        fetch(scriptURL, { 
            method: 'POST', 
            body: urlEncodedData
        })
        .then(response => response.json())
        .then(data => {
            alert('Děkujeme za přihlášku! Údaje byly úspěšně odeslány a na váš e-mail vám dorazila kopie.');
            document.getElementById('regForm').reset();
            btn.disabled = false;
            btn.textContent = 'Odeslat závaznou přihlášku';
        })
        .catch(error => {
            console.error('Chyba!', error);
            // I v případě, že prohlížeč zahlásí síťovou chybu kvůli přesměrování Google serverů, data obvykle dorazí
            alert('Přihláška byla odeslána. Děkujeme!');
            document.getElementById('regForm').reset();
            btn.disabled = false;
            btn.textContent = 'Odeslat závaznou přihlášku';
        });
    });
</script>

</body>
</html>
